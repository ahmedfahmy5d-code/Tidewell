<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
        <meta name="theme-color" content="#141b2d">

<body id="home">

            <img src="./icon.svg" alt="icon">
            <a href="#home">Tidewell</a>
        </div>

        <div class="list">

            <li><a href="#">services</a></li>
